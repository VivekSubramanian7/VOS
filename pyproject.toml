[project]
name = "vos"
version = "0.1.0"
description = "VOS — Telegram capture into a knowledge graph"
requires-python = ">=3.13"
dependencies = [
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    # Imported directly by vos.settings to put provider keys on the real environment.
    # Already arrives via pydantic-settings, but declared because we import it.
    "python-dotenv>=1.0",
    "aiogram>=3.27",
    "neo4j>=6.2",
    "langgraph>=1.0",
    "langchain-core>=1.0",
    # Only for init_chat_model (provider-agnostic model resolution). In 1.x this is a
    # thin layer over langchain-core + langgraph — it resolves to a single extra wheel,
    # not the 0.x mega-package.
    "langchain>=1.0",
    # One adapter per provider you actually intend to run. Each is a thin wrapper over
    # that vendor's SDK, so the cost is visible and bounded — google-genai brings the
    # Google auth/crypto chain with it (9 wheels), anthropic brings almost nothing.
    "langchain-anthropic>=1.0",
    "langchain-google-genai>=4.3",
    "httpx>=0.27",
    "typer>=0.12",
    "youtube-transcript-api>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
    "testcontainers[neo4j]>=4.8",
]
# The kitchen kiosk web surface. Optional because faster-whisper drags ctranslate2 +
# onnxruntime + av (hundreds of MB); the daemon must stay installable without it, and
# vos.web is only imported when VOS_KIOSK_ENABLED is set.
kiosk = [
    "fastapi>=0.115",
    "uvicorn>=0.35",
    "python-multipart>=0.0.20",
    "faster-whisper>=1.1",
]

[project.scripts]
vos = "vos.cli:main"
vos-bot = "vos.shell:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vos"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# Integration tests need Docker; deselect with -m "not integration"
markers = [
    "integration: requires a real Neo4j container",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
