# Phase 1 runs on the dev machine. Moving to a VPS is `docker compose up` elsewhere
# plus copying journal/ — no code change (long-polling needs no inbound network).
#
# During development you will usually run only neo4j here and run the app locally
# with `uv run vos-bot` for fast iteration:
#     docker compose up -d neo4j

services:
  neo4j:
    # Neo4j uses calendar versioning (2026.06.0), not 5.x. Pinned to an exact
    # patch so dev, CI, and the VPS all run the same database.
    image: neo4j:2026.06.0-community
    container_name: vos-neo4j
    restart: unless-stopped
    ports:
      # Bound to loopback only — never exposed to the network.
      - "127.0.0.1:7474:7474"   # Browser
      - "127.0.0.1:7687:7687"   # Bolt
    environment:
      # Derived from NEO4J_PASSWORD so there is exactly one copy of this secret.
      # Two variables would silently drift, and because Neo4j bakes the password
      # into the data volume on FIRST start only, the drift surfaces much later
      # as an unexplained auth failure.
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:?set NEO4J_PASSWORD in .env (8+ characters)}
      NEO4J_server_memory_heap_max__size: 1G
      NEO4J_server_memory_pagecache_size: 512M
    volumes:
      - neo4j-data:/data
      - neo4j-logs:/logs
    healthcheck:
      # cypher-shell exits non-zero until the database is actually accepting queries.
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p \"$${NEO4J_AUTH#*/}\" 'RETURN 1' || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 40s

  app:
    build: .
    container_name: vos-app
    restart: unless-stopped
    depends_on:
      neo4j:
        condition: service_healthy
    env_file: .env
    environment:
      # Inside the compose network Neo4j is reachable by service name.
      NEO4J_URI: bolt://neo4j:7687
      # The kiosk must bind all container interfaces to be reachable through
      # the published port below. Exposure on the HOST stays loopback-only via
      # the 127.0.0.1 port binding — the tailnet is still the perimeter (ADR-015).
      VOS_KIOSK_HOST: 0.0.0.0
      # SQLite WAL locking is unreliable over Windows bind mounts (gRPC-FUSE),
      # and shopping.db is a disposable projection anyway — keep it on a named
      # volume: nothing to back up, nothing to corrupt.
      VOS_SHOPPING_DB: /data/shopping.db
    ports:
      # Loopback only — reached solely via `tailscale serve` on the host.
      # Hardcodes the default VOS_KIOSK_PORT; change both together.
      - "127.0.0.1:8765:8765"
    volumes:
      # The journal is the source of truth — it lives on the host, not in the image.
      - ./journal:/app/journal
      # Transcripts cannot be re-fetched once a video is gone; same treatment.
      - ./artifacts:/app/artifacts
      - ./cassettes:/app/cassettes
      # Disposable projections and the whisper model cache: named volumes,
      # Linux-native filesystem, survive container rebuilds.
      - vos-data:/data
      - hf-cache:/root/.cache/huggingface

volumes:
  neo4j-data:
  neo4j-logs:
  vos-data:
  hf-cache:
